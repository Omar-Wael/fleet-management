<header class="app-header">
  <button
    type="button"
    class="menu-toggle"
    (click)="toggleSidebar()"
    [attr.aria-expanded]="layout.sidebarOpen()"
    [attr.aria-label]="'nav.menu' | translate"
  >
    <span class="menu-toggle-bar"></span>
    <span class="menu-toggle-bar"></span>
    <span class="menu-toggle-bar"></span>
  </button>

  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a routerLink="/dashboard" class="breadcrumb-crumb" [class.current]="isHome()">
      {{ 'nav.dashboard' | translate }}
    </a>
    @if (!isHome() && currentSection()) {
      <span class="breadcrumb-sep" aria-hidden="true">/</span>
      <span class="breadcrumb-crumb current">{{ currentSection()!.labelKey | translate }}</span>
    }
  </nav>

  <div class="header-actions">
    <button type="button" class="lang-toggle" (click)="i18n.toggle()">
      {{ 'nav.langToggle' | translate }}
    </button>

    <div class="user-menu" [class.user-menu--open]="menuOpen()">
      <button
        type="button"
        class="user-menu-trigger"
        (click)="toggleMenu($event)"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-haspopup]="true"
        [attr.aria-label]="'auth.accountMenu' | translate"
      >
        <span class="user-chip-avatar" aria-hidden="true">{{ initial() }}</span>
        <span class="user-menu-text">
          <span class="user-chip-name">{{ auth.displayName() }}</span>
          <span class="user-chip-role">{{ roleLabel() }}</span>
        </span>
        <span class="user-menu-caret" aria-hidden="true">▾</span>
      </button>

      @if (menuOpen()) {
        <div class="user-menu-dropdown" role="menu">
          <div class="user-menu-summary">
            <span class="user-menu-summary-name">{{ auth.displayName() }}</span>
            <span class="user-menu-summary-role">{{ roleLabel() }}</span>
            @if (auth.profile()?.email) {
              <span class="user-menu-summary-email">{{ auth.profile()?.email }}</span>
            }
          </div>
          <div class="user-menu-divider"></div>
          <button type="button" class="user-menu-item" role="menuitem" (click)="goProfile()">
            <span class="user-menu-item-icon" aria-hidden="true">👤</span>
            {{ 'auth.profileTitle' | translate }}
          </button>
          <button type="button" class="user-menu-item user-menu-item--danger" role="menuitem" (click)="logout()">
            <span class="user-menu-item-icon" aria-hidden="true">⎋</span>
            {{ 'auth.signOut' | translate }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
