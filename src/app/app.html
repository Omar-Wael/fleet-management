<div class="shell">
  <aside class="shell-nav">
    <div class="shell-brand">
      <span class="shell-brand-mark">FL</span>
      <span class="shell-brand-name">Fleet Ops</span>
    </div>

    <nav>
      @for (item of navItems; track item.path) {
        <a [routerLink]="[item.path]" routerLinkActive="active" class="shell-nav-link">
          <span class="shell-nav-label-ar">{{ item.labelKey | translate }}</span>
        </a>
      }
    </nav>

    <button type="button" class="lang-toggle" (click)="i18n.toggle()">
      {{ 'nav.langToggle' | translate }}
    </button>
  </aside>

  <main class="shell-main">
    <router-outlet></router-outlet>
  </main>
</div>
