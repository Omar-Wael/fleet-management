@if (open) {
  <div class="overlay" (click)="close()"></div>

  <aside class="slide-over" role="dialog" aria-modal="true">
    <header class="slide-over-header">
      <h2>{{ (isEditMode ? 'vehicles.editTitle' : 'vehicles.addTitle') | translate }}</h2>
      <button type="button" class="icon-btn" (click)="close()" aria-label="Close">✕</button>
    </header>

    @if (lookupsLoading) {
      <div class="state-message">{{ 'vehicles.loadingFormOptions' | translate }}</div>
    } @else if (lookupsError) {
      <div class="state-message state-message--error">{{ lookupsError }}</div>
    } @else {
      <form class="slide-over-body" [formGroup]="form" (ngSubmit)="submit()">
        <div class="field-grid">
          <label class="field">
            <span>{{ 'vehicles.plateNumber' | translate }} *</span>
            <input type="text" formControlName="plate_number" />
          </label>

          <label class="field">
            <span>{{ 'vehicles.vehicleType' | translate }} *</span>
            <select formControlName="vehicle_type_id">
              <option [ngValue]="''" disabled>{{ 'vehicles.selectType' | translate }}</option>
              @for (t of vehicleTypes; track t.id) {
                <option [ngValue]="t.id">{{ t.name_en || t.name_ar }}</option>
              }
            </select>
          </label>

          <label class="field">
            <span>{{ 'vehicles.operatingDept' | translate }}</span>
            <select formControlName="operating_department_id">
              <option [ngValue]="null">—</option>
              @for (d of departments; track d.id) {
                <option [ngValue]="d.id">{{ d.name_en || d.name_ar }}</option>
              }
            </select>
          </label>

          <label class="field">
            <span>{{ 'vehicles.repairDeptWorkshop' | translate }} *</span>
            <select formControlName="maintenance_workshop_id">
              <option [ngValue]="''" disabled>{{ 'vehicles.selectWorkshop' | translate }}</option>
              @for (w of workshops; track w.id) {
                <option [ngValue]="w.id">{{ w.name_en || w.name_ar }} ({{ w.workshop_type }})</option>
              }
            </select>
          </label>

          <label class="field">
            <span>{{ 'vehicles.currentEngine' | translate }}</span>
            <select formControlName="current_engine_id">
              <option [ngValue]="null">{{ 'common.none' | translate }}</option>
              @for (e of engines; track e.id) {
                <option [ngValue]="e.id">{{ e.engine_serial_number }} — {{ e.model_name || ('vehicles.unknownModel' | translate) }}</option>
              }
            </select>
          </label>

          <label class="field">
            <span>{{ 'common.status' | translate }} *</span>
            <select formControlName="status">
              @for (s of statusOptions; track s.value) {
                <option [ngValue]="s.value">{{ s.labelKey | translate }}</option>
              }
            </select>
          </label>

          <label class="field">
            <span>{{ 'vehicles.make' | translate }}</span>
            <input type="text" formControlName="make" />
          </label>

          <label class="field">
            <span>{{ 'vehicles.model' | translate }}</span>
            <input type="text" formControlName="model" />
          </label>

          <label class="field">
            <span>{{ 'vehicles.manufactureYear' | translate }}</span>
            <input type="number" formControlName="manufacture_year" />
          </label>

          <label class="field">
            <span>{{ 'vehicles.chassisNumber' | translate }}</span>
            <input type="text" formControlName="chassis_number" />
          </label>

          <label class="field">
            <span>{{ 'vehicles.color' | translate }}</span>
            <input type="text" formControlName="color" />
          </label>

          <label class="field">
            <span>{{ 'vehicles.odometerReading' | translate }}</span>
            <input type="number" formControlName="odometer_km" />
          </label>

          <label class="field">
            <span>{{ 'vehicles.odometerUnit' | translate }}</span>
            <select formControlName="odometer_unit">
              <option value="km">{{ 'vehicles.unitKm' | translate }}</option>
              <option value="hours">{{ 'vehicles.unitHours' | translate }}</option>
              <option value="other">{{ 'vehicles.unitOther' | translate }}</option>
            </select>
          </label>

          <label class="field field--checkbox">
            <input type="checkbox" formControlName="odometer_working" />
            <span>{{ 'vehicles.odometerWorking' | translate }}</span>
          </label>

          <label class="field">
            <span>{{ 'vehicles.lastOdometerReadingDate' | translate }}</span>
            <input type="date" formControlName="last_odometer_reading_date" />
          </label>

          <label class="field">
            <span>{{ 'vehicles.garageLocation' | translate }}</span>
            <select formControlName="current_garage_location_id">
              <option [ngValue]="null">{{ 'vehicles.notLodged' | translate }}</option>
              @for (g of garageLocations; track g.id) {
                <option [ngValue]="g.id">{{ g.garage_name }}</option>
              }
            </select>
          </label>

          <label class="field">
            <span>{{ 'vehicles.custodianName' | translate }}</span>
            <input type="text" formControlName="custodian_name" />
          </label>

          <label class="field">
            <span>{{ 'vehicles.custodianPhone' | translate }}</span>
            <input type="text" formControlName="custodian_phone" />
          </label>

          <label class="field field--wide">
            <span>{{ 'common.notes' | translate }}</span>
            <textarea formControlName="notes" rows="3"></textarea>
          </label>
        </div>

        @if (saveError) {
          <div class="state-message state-message--error">{{ saveError }}</div>
        }

        <footer class="slide-over-footer">
          <button type="button" class="btn btn--ghost" (click)="close()" [disabled]="saving">
            {{ 'common.cancel' | translate }}
          </button>
          <button type="submit" class="btn btn--primary" [disabled]="saving">
            {{ (saving ? 'common.saving' : (isEditMode ? 'common.saveChanges' : 'vehicles.addButton')) | translate }}
          </button>
        </footer>
      </form>
    }
  </aside>
}
