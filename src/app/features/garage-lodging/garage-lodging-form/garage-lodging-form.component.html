@if (open) {
  <div class="overlay" (click)="close()"></div>

  <aside class="slide-over" role="dialog" aria-modal="true">
    <header class="slide-over-header">
      <h2>{{ 'garageLodging.checkInTitle' | translate }}</h2>
      <button type="button" class="icon-btn" (click)="close()" aria-label="Close">✕</button>
    </header>

    @if (lookupsLoading) {
      <div class="state-message">{{ 'garageLodging.loadingFormOptions' | translate }}</div>
    } @else {
      <form class="slide-over-body" [formGroup]="form" (ngSubmit)="submit()">
        @if (lookupsError) {
          <div class="state-message state-message--error">{{ lookupsError }}</div>
        }

        <div class="field-grid">
          <label class="field">
            <span>{{ 'garageLodging.vehicle' | translate }} *</span>
            <select formControlName="vehicle_id">
              <option [ngValue]="''" disabled>{{ 'garageLodging.selectVehicle' | translate }}</option>
              @for (v of vehicles; track v.id) {
                <option [ngValue]="v.id">{{ v.plate_number }}</option>
              }
            </select>
          </label>

          <label class="field">
            <span>{{ 'garageLodging.garageLocation' | translate }}</span>
            <select formControlName="garage_location_id">
              <option [ngValue]="null">{{ 'garageLodging.unassigned' | translate }}</option>
              @for (g of garageLocations; track g.id) {
                <option [ngValue]="g.id">{{ g.garage_name }} ({{ g.zone_label }})</option>
              }
            </select>
          </label>

          <label class="field">
            <span>{{ 'garageLodging.entryDate' | translate }} *</span>
            <input type="date" formControlName="entry_date" />
          </label>

          <label class="field field--wide">
            <span>{{ 'garageLodging.reason' | translate }} *</span>
            <textarea formControlName="reason" rows="3"></textarea>
          </label>
        </div>

        @if (saveError) {
          <div class="state-message state-message--error">{{ saveError }}</div>
        }

        <footer class="slide-over-footer">
          <button type="button" class="btn btn--ghost" (click)="close()" [disabled]="saving">{{ 'common.cancel' | translate }}</button>
          <button type="submit" class="btn btn--primary" [disabled]="saving">
            {{ (saving ? 'common.saving' : 'garageLodging.checkIn') | translate }}
          </button>
        </footer>
      </form>
    }
  </aside>
}
