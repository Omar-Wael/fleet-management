<div class="vendors-page">
  <header class="page-header">
    <div>
      <h2>{{ 'spareParts.page.tabVendors' | translate }}</h2>
      <p class="page-subtitle">{{ total }} {{ 'spareParts.vendors.count' | translate }}</p>
    </div>

    <div class="page-actions">
      <button type="button" class="btn btn--primary" (click)="openAddForm()">
        {{ 'spareParts.vendors.addButton' | translate }}
      </button>
    </div>
  </header>

  @if (formOpen) {
    <form class="add-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field-grid">
        <label class="field">
          <span>{{ 'spareParts.vendors.fieldName' | translate }}</span>
          <input type="text" formControlName="name" />
        </label>

        <label class="field">
          <span>{{ 'spareParts.vendors.fieldVendorType' | translate }}</span>
          <select formControlName="vendor_type">
            @for (t of vendorTypeOptions; track t.value) {
              <option [value]="t.value">{{ t.labelKey | translate }}</option>
            }
          </select>
        </label>

        <label class="field">
          <span>{{ 'spareParts.vendors.fieldContactPerson' | translate }}</span>
          <input type="text" formControlName="contact_person" />
        </label>

        <label class="field">
          <span>{{ 'common.phone' | translate }}</span>
          <input type="text" formControlName="phone" />
        </label>

        <label class="field">
          <span>{{ 'spareParts.vendors.fieldSpecialty' | translate }}</span>
          <input type="text" formControlName="specialty" />
        </label>

        <label class="field">
          <span>{{ 'spareParts.vendors.fieldAddress' | translate }}</span>
          <input type="text" formControlName="address" />
        </label>

        <label class="field field--checkbox">
          <input type="checkbox" formControlName="is_active" />
          <span>{{ 'common.active' | translate }}</span>
        </label>
      </div>

      @if (saveError) {
        <div class="state-message state-message--error">{{ saveError }}</div>
      }

      <div class="form-actions">
        <button type="button" class="btn btn--ghost" (click)="cancelAddForm()" [disabled]="saving">{{ 'common.cancel' | translate }}</button>
        <button type="submit" class="btn btn--primary" [disabled]="saving">
          {{ (saving ? 'common.saving' : 'spareParts.vendors.addSubmit') | translate }}
        </button>
      </div>
    </form>
  }

  @if (loadError) {
    <div class="state-message state-message--error">{{ loadError }}</div>
  }

  <app-data-table
    [columns]="columns"
    [rows]="rows"
    [total]="total"
    [loading]="loading"
    [filters]="filters"
    [searchPlaceholder]="'spareParts.vendors.searchPlaceholder' | translate"
    [emptyMessage]="'spareParts.vendors.noResults' | translate"
    actionsColumnKey=""
    (queryChange)="onQueryChange($event)"
  ></app-data-table>
</div>
