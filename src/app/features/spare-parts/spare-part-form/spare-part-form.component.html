@if (open) {
  <div class="overlay" (click)="close()"></div>

  <aside class="slide-over" role="dialog" aria-modal="true">
    <header class="slide-over-header">
      <h2>{{ isEditMode ? 'Edit Spare Part' : 'Add Spare Part' }}</h2>
      <button type="button" class="icon-btn" (click)="close()" aria-label="Close">✕</button>
    </header>

    <form class="slide-over-body" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field-grid">
        <label class="field">
          <span>Part Code</span>
          <input type="text" formControlName="part_code" />
        </label>

        <label class="field">
          <span>Name (Arabic) *</span>
          <input type="text" formControlName="name_ar" />
        </label>

        <label class="field">
          <span>Name (English)</span>
          <input type="text" formControlName="name_en" />
        </label>

        <label class="field">
          <span>Unit</span>
          <input type="text" formControlName="unit" placeholder="e.g. piece, liter, set" />
        </label>

        <label class="field">
          <span>Unit Cost</span>
          <input type="number" step="0.01" formControlName="unit_cost" />
        </label>

        <label class="field">
          <span>Current Stock Qty *</span>
          <input type="number" formControlName="current_stock_qty" />
        </label>

        <label class="field">
          <span>Reorder Threshold</span>
          <input type="number" formControlName="reorder_threshold" />
        </label>
      </div>

      @if (saveError) {
        <div class="state-message state-message--error">{{ saveError }}</div>
      }

      <footer class="slide-over-footer">
        <button type="button" class="btn btn--ghost" (click)="close()" [disabled]="saving">Cancel</button>
        <button type="submit" class="btn btn--primary" [disabled]="saving">
          {{ saving ? 'Saving…' : (isEditMode ? 'Save Changes' : 'Add Part') }}
        </button>
      </footer>
    </form>
  </aside>
}
