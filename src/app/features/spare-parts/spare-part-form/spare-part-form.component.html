@if (open) {
  <div class="overlay" (click)="close()"></div>

  <aside class="slide-over" role="dialog" aria-modal="true">
    <header class="slide-over-header">
      <h2>{{ (isEditMode ? 'spareParts.partForm.editTitle' : 'spareParts.partForm.addTitle') | translate }}</h2>
      <button type="button" class="icon-btn" (click)="close()" [attr.aria-label]="'common.close' | translate">✕</button>
    </header>

    <form class="slide-over-body" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field-grid">
        <label class="field">
          <span>{{ 'spareParts.catalog.colPartCode' | translate }}</span>
          <input type="text" formControlName="part_code" />
        </label>

        <label class="field">
          <span>{{ 'spareParts.partForm.fieldNameAr' | translate }}</span>
          <input type="text" formControlName="name_ar" />
        </label>

        <label class="field">
          <span>{{ 'spareParts.catalog.colNameEn' | translate }}</span>
          <input type="text" formControlName="name_en" />
        </label>

        <label class="field">
          <span>{{ 'spareParts.catalog.colUnit' | translate }}</span>
          <input type="text" formControlName="unit" [placeholder]="'spareParts.partForm.unitPlaceholder' | translate" />
        </label>

        <label class="field">
          <span>{{ 'spareParts.catalog.colUnitCost' | translate }}</span>
          <input type="number" step="0.01" formControlName="unit_cost" />
        </label>

        <label class="field">
          <span>{{ 'spareParts.partForm.fieldStockQty' | translate }}</span>
          <input type="number" formControlName="current_stock_qty" />
        </label>

        <label class="field">
          <span>{{ 'spareParts.partForm.fieldReorderThreshold' | translate }}</span>
          <input type="number" formControlName="reorder_threshold" />
        </label>
      </div>

      @if (saveError) {
        <div class="state-message state-message--error">{{ saveError }}</div>
      }

      <footer class="slide-over-footer">
        <button type="button" class="btn btn--ghost" (click)="close()" [disabled]="saving">{{ 'common.cancel' | translate }}</button>
        <button type="submit" class="btn btn--primary" [disabled]="saving">
          {{ (saving ? 'common.saving' : (isEditMode ? 'common.saveChanges' : 'spareParts.partForm.addSubmit')) | translate }}
        </button>
      </footer>
    </form>
  </aside>
}
