<div class="disbursements-page">
  <header class="page-header">
    <div>
      <h2>{{ 'spareParts.disbursement.title' | translate }}</h2>
      <p class="page-subtitle">{{ total }} {{ 'spareParts.disbursement.requestsCount' | translate }}</p>
    </div>

    <div class="page-actions">
      <button type="button" class="btn btn--ghost" (click)="exportExcel()">{{ 'common.exportExcel' | translate }}</button>
      <button type="button" class="btn btn--ghost" (click)="exportPdf()">{{ 'common.exportPdf' | translate }}</button>
      <button type="button" class="btn btn--primary" (click)="openCreateForm()">
        {{ 'spareParts.disbursement.newRequestButton' | translate }}
      </button>
    </div>
  </header>

  @if (loadError) {
    <div class="state-message state-message--error">{{ loadError }}</div>
  }

  <app-data-table
    [columns]="columns"
    [rows]="rows"
    [total]="total"
    [loading]="loading"
    [filters]="filters"
    [searchPlaceholder]="'spareParts.disbursement.searchPlaceholder' | translate"
    [emptyMessage]="'spareParts.disbursement.noResults' | translate"
    actionsColumnKey="actions"
    (queryChange)="onQueryChange($event)"
  ></app-data-table>
</div>

<app-disbursement-form
  [open]="formOpen"
  (closed)="onFormClosed()"
  (saved)="onFormSaved()"
></app-disbursement-form>

<app-disbursement-detail-drawer
  [open]="drawerOpen"
  [request]="selectedRequest"
  (closed)="onDrawerClosed()"
  (updated)="onDrawerUpdated()"
></app-disbursement-detail-drawer>
