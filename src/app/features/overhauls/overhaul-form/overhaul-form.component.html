@if (open) {
  <div class="overlay" (click)="close()"></div>

  <aside class="slide-over" role="dialog" aria-modal="true">
    <header class="slide-over-header">
      <h2>{{ 'overhauls.formTitle' | translate }}</h2>
      <button type="button" class="icon-btn" (click)="close()" [attr.aria-label]="'common.close' | translate">✕</button>
    </header>

    @if (lookupsLoading) {
      <div class="state-message">{{ 'overhauls.loadingFormOptions' | translate }}</div>
    } @else {
      <form class="slide-over-body" [formGroup]="form" (ngSubmit)="submit()">
        @if (lookupsError) {
          <div class="state-message state-message--error">{{ lookupsError }}</div>
        }

        <div class="field-grid">
          <label class="field">
            <span>{{ 'overhauls.fieldVehicle' | translate }}</span>
            <select formControlName="vehicle_id">
              <option [ngValue]="''" disabled>{{ 'overhauls.selectVehicle' | translate }}</option>
              @for (v of vehicles; track v.id) {
                <option [ngValue]="v.id">{{ v.plate_number }}</option>
              }
            </select>
          </label>

          <label class="field">
            <span>{{ 'overhauls.machineShop' | translate }}</span>
            <select formControlName="machine_shop_id">
              <option [ngValue]="null">{{ 'overhauls.tbd' | translate }}</option>
              @for (m of machineShops; track m.id) {
                <option [ngValue]="m.id">{{ m.name }}</option>
              }
            </select>
          </label>

          <label class="field">
            <span>{{ 'overhauls.fieldEntryDate' | translate }}</span>
            <input type="date" formControlName="entry_date" />
          </label>

          <label class="field field--wide">
            <span>{{ 'overhauls.fieldScopeDescription' | translate }}</span>
            <textarea formControlName="scope_description" rows="4"></textarea>
          </label>
        </div>

        @if (saveError) {
          <div class="state-message state-message--error">{{ saveError }}</div>
        }

        <footer class="slide-over-footer">
          <button type="button" class="btn btn--ghost" (click)="close()" [disabled]="saving">
            {{ 'common.cancel' | translate }}
          </button>
          <button type="submit" class="btn btn--primary" [disabled]="saving">
            {{ (saving ? 'common.saving' : 'overhauls.createOverhaul') | translate }}
          </button>
        </footer>
      </form>
    }
  </aside>
}
