<div class="analytics-panel">
  <header class="panel-header">
    <div>
      <h2>{{ 'analytics.departmentCostTitle' | translate }}</h2>
      <p class="panel-subtitle">
        {{ total }} {{ 'analytics.departmentCount' | translate }} &middot;
        {{ 'analytics.total' | translate }} {{ totalCost | number: '1.2-2' }}
      </p>
    </div>

    <div class="panel-actions">
      <button type="button" class="btn btn--ghost" (click)="exportExcel()" [disabled]="!allRows.length">
        {{ 'common.exportExcel' | translate }}
      </button>
    </div>
  </header>

  @if (loadError) {
    <div class="state-message state-message--error">{{ loadError }}</div>
  } @else {
    <div class="chart-card">
      <canvas #costChartCanvas></canvas>
    </div>

    <app-data-table
      [columns]="columns"
      [rows]="rows"
      [total]="total"
      [loading]="loading"
      [searchPlaceholder]="'analytics.department' | translate"
      [emptyMessage]="'analytics.noDepartmentCostData' | translate"
      [pageSize]="currentQuery.pageSize"
      (queryChange)="onQueryChange($event)"
    ></app-data-table>
  }
</div>
