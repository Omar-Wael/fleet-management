<div class="analytics-panel">
  <header class="panel-header">
    <div>
      <h2>{{ 'analytics.vendorPriceComparisonTitle' | translate }}</h2>
      <p class="panel-subtitle">{{ total }} {{ 'analytics.vendorCount' | translate }}</p>
    </div>

    <div class="panel-actions">
      <button type="button" class="btn btn--ghost" (click)="exportExcel()" [disabled]="!allRows.length">
        {{ 'common.exportExcel' | translate }}
      </button>
    </div>
  </header>

  @if (loadError) {
    <div class="state-message state-message--error">{{ loadError }}</div>
  } @else {
    <div class="chart-card">
      <canvas #priceChartCanvas></canvas>
    </div>

    <app-data-table
      [columns]="columns"
      [rows]="rows"
      [total]="total"
      [loading]="loading"
      [searchPlaceholder]="'analytics.vendor' | translate"
      [emptyMessage]="'analytics.noVendorPurchases' | translate"
      [pageSize]="currentQuery.pageSize"
      (queryChange)="onQueryChange($event)"
    ></app-data-table>
  }
</div>
