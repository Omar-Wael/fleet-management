<div class="lookup-panel">
  <header class="panel-header">
    <div>
      <h2>{{ 'settings.workshops.title' | translate }}</h2>
      <p class="panel-subtitle">{{ total }} {{ 'settings.workshops.countUnit' | translate }}</p>
    </div>
    <button type="button" class="btn btn--primary" (click)="startAdd()" [disabled]="addingNew">
      {{ 'settings.workshops.addButton' | translate }}
    </button>
  </header>

  @if (addingNew) {
    <div class="add-row-form">
      <input
        type="text"
        [(ngModel)]="newDraft.name_ar"
        [placeholder]="'settings.workshops.nameArabicPlaceholder' | translate"
      />
      <input
        type="text"
        [(ngModel)]="newDraft.name_en"
        [placeholder]="'settings.workshops.nameEnglishPlaceholder' | translate"
      />
      <select [(ngModel)]="newDraft.workshop_type">
        <option value="" disabled>{{ 'settings.workshops.selectType' | translate }}</option>
        @for (type of workshopTypes; track type) {
          <option [value]="type">{{ type }}</option>
        }
      </select>
      <input type="text" [(ngModel)]="newDraft.location_notes" />
      <button type="button" class="btn btn--ghost" (click)="cancelAdd()" [disabled]="saving">
        {{ 'common.cancel' | translate }}
      </button>
      <button type="button" class="btn btn--primary" (click)="confirmAdd()" [disabled]="saving">
        {{ (saving ? 'common.saving' : 'common.save') | translate }}
      </button>
    </div>
  }

  @if (saveError) {
    <div class="state-message state-message--error">{{ saveError }}</div>
  }

  @if (loadError) {
    <div class="state-message state-message--error">{{ loadError }}</div>
  }

  <app-data-table
    [columns]="columns"
    [rows]="rows"
    [total]="total"
    [loading]="loading"
    [pageSizeOptions]="[10, 25, 50]"
    [pageSize]="10"
    [emptyMessage]="'settings.workshops.empty' | translate"
    actionsColumnKey="actions"
    (queryChange)="onQueryChange($event)"
  ></app-data-table>
</div>
