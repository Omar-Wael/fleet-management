<div class="tab-nav">
  <button type="button" class="tab-btn" [class.tab-btn--active]="activeTab === 'vehicle-types'" (click)="setTab('vehicle-types')">
    {{ 'settings.vehicleTypes.title' | translate }}
  </button>
  <button type="button" class="tab-btn" [class.tab-btn--active]="activeTab === 'departments'" (click)="setTab('departments')">
    {{ 'settings.departments.title' | translate }}
  </button>
  <button type="button" class="tab-btn" [class.tab-btn--active]="activeTab === 'workshops'" (click)="setTab('workshops')">
    {{ 'settings.workshops.title' | translate }}
  </button>
  <button type="button" class="tab-btn" [class.tab-btn--active]="activeTab === 'garage-locations'" (click)="setTab('garage-locations')">
    {{ 'settings.garageLocations.title' | translate }}
  </button>
</div>

<div class="tab-content">
  @switch (activeTab) {
    @case ('vehicle-types') {
      <app-vehicle-types-tab></app-vehicle-types-tab>
    }
    @case ('departments') {
      <app-departments-tab></app-departments-tab>
    }
    @case ('workshops') {
      <app-workshops-tab></app-workshops-tab>
    }
    @case ('garage-locations') {
      <app-garage-locations-tab></app-garage-locations-tab>
    }
  }
</div>
