<div class="lookup-panel">
  <header class="panel-header">
    <div>
      <h2>{{ 'settings.garageLocations.title' | translate }}</h2>
      <p class="panel-subtitle">{{ total }} {{ 'settings.garageLocations.countUnit' | translate }}</p>
    </div>
    <button type="button" class="btn btn--primary" (click)="startAdd()" [disabled]="addingNew">
      {{ 'settings.garageLocations.addButton' | translate }}
    </button>
  </header>

  @if (addingNew) {
    <div class="add-row-form">
      <input
        type="text"
        [(ngModel)]="newDraft.garage_name"
        [placeholder]="'settings.garageLocations.colGarageName' | translate"
      />
      <app-searchable-select
        [options]="workshopOptions"
        [(ngModel)]="newDraft.workshop_id"
        [placeholder]="'common.none' | translate"
      ></app-searchable-select>
      <input
        type="text"
        [(ngModel)]="newDraft.zone_label"
        [placeholder]="'settings.garageLocations.zoneLabelPlaceholder' | translate"
      />
      <input type="text" [(ngModel)]="newDraft.notes" [placeholder]="'common.notes' | translate" />
      <button type="button" class="btn btn--ghost" (click)="cancelAdd()" [disabled]="saving">
        {{ 'common.cancel' | translate }}
      </button>
      <button type="button" class="btn btn--primary" (click)="confirmAdd()" [disabled]="saving">
        {{ (saving ? 'common.saving' : 'common.save') | translate }}
      </button>
    </div>
  }

  @if (saveError) {
    <div class="state-message state-message--error">{{ saveError }}</div>
  }

  @if (loadError) {
    <div class="state-message state-message--error">{{ loadError }}</div>
  }

  <app-data-table
    [columns]="columns"
    [rows]="rows"
    [total]="total"
    [loading]="loading"
    [filters]="filters"
    [pageSizeOptions]="[10, 25, 50]"
    [pageSize]="10"
    [emptyMessage]="'settings.garageLocations.empty' | translate"
    actionsColumnKey="actions"
    (queryChange)="onQueryChange($event)"
  ></app-data-table>
</div>
