<div class="checks-page">
  <header class="page-header">
    <div>
      <h1>{{ 'checks.title' | translate }}</h1>
      <p class="page-subtitle">{{ total }} {{ 'checks.shown' | translate }}</p>
    </div>

    <div class="page-actions">
      <button type="button" class="btn btn--ghost" (click)="exportExcel()">
        {{ 'common.exportExcel' | translate }}
      </button>
      <button type="button" class="btn btn--ghost" (click)="exportPdf()">
        {{ 'common.exportPdf' | translate }}
      </button>
      <button type="button" class="btn btn--primary" (click)="openCreateForm()">
        {{ 'checks.addButton' | translate }}
      </button>
    </div>
  </header>

  @if (loadError) {
    <div class="state-message state-message--error">{{ loadError }}</div>
  }

  <app-data-table
    [columns]="columns"
    [rows]="rows"
    [total]="total"
    [loading]="loading"
    [filters]="filters"
    [searchPlaceholder]="'checks.searchPlaceholder' | translate"
    [emptyMessage]="'checks.noResults' | translate"
    actionsColumnKey="actions"
    (queryChange)="onQueryChange($event)"
  ></app-data-table>
</div>

<app-check-form
  [open]="formOpen"
  (closed)="onFormClosed()"
  (saved)="onFormSaved()"
></app-check-form>

<app-check-detail-drawer
  [open]="drawerOpen"
  [check]="selectedCheck"
  (closed)="onDrawerClosed()"
  (updated)="onDrawerUpdated()"
></app-check-detail-drawer>
