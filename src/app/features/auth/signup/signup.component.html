<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-mark">FL</span>
      <h1>{{ 'auth.signupTitle' | translate }}</h1>
      <p class="auth-sub">{{ 'auth.signupSubtitle' | translate }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label class="field">
        <span>{{ 'auth.fullName' | translate }}</span>
        <input type="text" formControlName="full_name" autocomplete="name" />
        @if (form.controls.full_name.touched && form.controls.full_name.invalid) {
          <small class="field-error">{{ 'auth.fieldRequired' | translate }}</small>
        }
      </label>

      <label class="field">
        <span>{{ 'auth.email' | translate }}</span>
        <input type="email" formControlName="email" autocomplete="username" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field-error">{{ 'auth.emailInvalid' | translate }}</small>
        }
      </label>

      <label class="field">
        <span>{{ 'auth.password' | translate }}</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field-error">{{ 'auth.passwordMin' | translate }}</small>
        }
      </label>

      <label class="field">
        <span>{{ 'auth.confirmPassword' | translate }}</span>
        <input type="password" formControlName="confirm" autocomplete="new-password" />
      </label>

      @if (error) {
        <div class="auth-error">{{ error }}</div>
      }
      @if (success) {
        <div class="auth-success">{{ success }}</div>
      }

      <button type="submit" class="btn btn--primary btn-block" [disabled]="loading">
        {{ (loading ? 'auth.signingUp' : 'auth.signUp') | translate }}
      </button>
    </form>

    <p class="auth-footer">
      {{ 'auth.haveAccount' | translate }}
      <a routerLink="/login">{{ 'auth.signIn' | translate }}</a>
    </p>
  </div>
</div>
